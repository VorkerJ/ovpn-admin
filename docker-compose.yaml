# ───────────────────────────────────────────────────────────────────────
#  ovpn-admin + OpenVPN, production-friendly docker-compose
#
#  Quick start (local dev / staging):
#      docker compose up -d
#
#  Single-VPS deployment:
#      cp .env.example .env
#      nano .env          # set OVPN_PUBLIC_HOSTNAME, port, proto, etc.
#      docker compose up -d
#
#  Admin UI binds to 127.0.0.1:8080 by default — reach it via SSH tunnel.
#  See README "Deploy on a single VPS" for the full guide.
# ───────────────────────────────────────────────────────────────────────

services:
  openvpn:
    build:
      context: .
      dockerfile: Dockerfile.openvpn
    image: ${OVPN_IMAGE:-openvpn:local}
    command: /etc/openvpn/setup/configure.sh
    restart: unless-stopped
    environment:
      OVPN_SERVER_NET: "${OVPN_NETWORK_BASE:-172.16.100.0}"
      OVPN_SERVER_MASK: "${OVPN_NETWORK_MASK:-255.255.255.0}"
      OVPN_PASSWD_AUTH: "${OVPN_PASSWD_AUTH:-false}"
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - MKNOD
      # CHOWN: configure.sh chgrp's the shared /etc/openvpn-dynamic volume to
      # group 2000 so ovpn-admin (non-root) can render server.conf there.
      # Without it the chgrp fails silently and the openvpn container waits for
      # a server.conf that never appears — the VPN never starts.
      - CHOWN
      # DAC_OVERRIDE: read CCD files written by ovpn-admin (different uid)
      # after OpenVPN drops privs to `nobody`.
      - DAC_OVERRIDE
      # SETUID/SETGID/SETPCAP: needed for OpenVPN to drop to `user nobody;
      # group nogroup` AND retain NET_ADMIN. Without SETPCAP the cap is
      # lost during the drop and DCO (kernel offload) silently disables.
      - SETUID
      - SETGID
      - SETPCAP
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 200
    ports:
      # OpenVPN public port. Defaults to UDP/1194 — change OVPN_PROTO to "tcp" if needed.
      # Host and container port are BOTH driven by ${OVPN_PORT} so the published
      # port always matches the port ovpn-admin renders into server.conf (seeded
      # via OVPN_SERVER_PORT/OVPN_SERVER_PROTO on the ovpn-admin service below).
      # LIMITATION: the runtime port/proto is UI-changeable. A change made in the
      # panel is written to server.conf and openvpn rebinds, but Docker's static
      # port publish can't follow it — update OVPN_PORT/OVPN_PROTO in .env and
      # re-run `docker compose up -d` to republish, or the VPN becomes unreachable.
      # Safe default: host port == container port == seeded server.conf port.
      - "${OVPN_PORT:-1194}:${OVPN_PORT:-1194}/${OVPN_PROTO:-udp}"
      # Admin UI. Defaults to localhost-only (127.0.0.1) so it's not exposed publicly.
      # Override OVPN_ADMIN_BIND=0.0.0.0 to expose (then put a TLS reverse proxy in front).
      - "${OVPN_ADMIN_BIND:-127.0.0.1}:${OVPN_ADMIN_PORT:-8080}:8080"
    volumes:
      - ${OVPN_EASYRSA_PATH:-./easyrsa_master}:/etc/openvpn/easyrsa
      - ${OVPN_CCD_PATH:-./ccd_master}:/etc/openvpn/ccd
      - ovpn_dynamic_conf:/etc/openvpn-dynamic

  ovpn-admin:
    build:
      context: .
      dockerfile: Dockerfile.ovpn-admin
    image: ${OVPN_ADMIN_IMAGE:-ovpn-admin:local}
    command: /app/ovpn-admin
    restart: unless-stopped
    environment:
      # VPN subnet ovpn-admin uses for IP allocation. Driven from the SAME base +
      # prefix as the openvpn container's OVPN_SERVER_NET/OVPN_SERVER_MASK so both
      # views agree. OVPN_NETWORK_PREFIX (CIDR bits) MUST describe the same subnet
      # as OVPN_NETWORK_MASK on the openvpn service — default /24 == 255.255.255.0.
      # Change both together if you use a different mask.
      OVPN_NETWORK: "${OVPN_NETWORK_BASE:-172.16.100.0}/${OVPN_NETWORK_PREFIX:-24}"
      # Seed the first-boot server.conf so the rendered config listens on the
      # SAME proto/port/network as the published port mapping and the openvpn
      # container's env — otherwise the built-in default (tcp/1194) would render
      # a server.conf that mismatches the udp/1194 published port and the VPN is
      # unreachable. These are the initial values; the UI can change them later.
      OVPN_SERVER_PROTO: "${OVPN_PROTO:-udp}"
      OVPN_SERVER_PORT: "${OVPN_PORT:-1194}"
      OVPN_SERVER_NETWORK: "${OVPN_NETWORK_BASE:-172.16.100.0}"
      OVPN_SERVER_NETWORK_MASK: "${OVPN_NETWORK_MASK:-255.255.255.0}"
      OVPN_CCD: "true"
      OVPN_CCD_PATH: "/mnt/ccd"
      EASYRSA_PATH: "/mnt/easyrsa"
      # Tells generated .ovpn client configs where to connect.
      # For VPS: set OVPN_PUBLIC_HOSTNAME to your public IP or DNS name.
      OVPN_SERVER: "${OVPN_PUBLIC_HOSTNAME:-127.0.0.1}:${OVPN_PORT:-1194}:${OVPN_PROTO:-udp}"
      OVPN_INDEX_PATH: "/mnt/easyrsa/pki/index.txt"
      OVPN_AUTH: "${OVPN_PASSWD_AUTH:-false}"
      OVPN_AUTH_DB_PATH: "/mnt/easyrsa/pki/users.db"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      OVPN_FIREWALL: "${OVPN_FIREWALL:-true}"
      OVPN_SERVER_CONFIG_PATH: "/etc/openvpn-dynamic/server.conf"
      # network_mode:service:openvpn shares the openvpn container's netns. On a
      # HARD server-config reload (port/proto/cipher/tls-mode/DCO change) the
      # openvpn container is recreated and gets a NEW netns; ovpn-admin would be
      # left bound to the dead one (admin UI 502). Self-exit on hard reload so the
      # restart policy brings it back attached to the live netns. REQUIRED for this
      # topology; leave false only when openvpn watches server.conf itself (Helm).
      OVPN_SERVER_CONFIG_HARD_RELOAD_SELF_EXIT: "true"
      # Pin admin password by mounting ./htpasswd → /mnt/auth/htpasswd (read-only)
      # When unset, ovpn-admin auto-generates a temporary password printed in logs.
      ADMIN_HTPASSWD_FILE: "${ADMIN_HTPASSWD_FILE:-}"
      # Durable auth state (session key, MFA secrets, self-changed admin
      # password, cumulative per-user traffic) on a named volume — survives
      # `down`/`up`, and keeps these writes off the read-only htpasswd mount.
      OVPN_SESSION_STATE_DIR: "/var/lib/ovpn-admin"
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    # network_mode shares the openvpn container's netns, but Compose doesn't
    # treat that as a dependency — without an explicit depends_on, recreating
    # openvpn (e.g. on image upgrade) can leave ovpn-admin bound to the dead
    # netns and the admin UI becomes unreachable (502 from any front proxy).
    depends_on:
      openvpn:
        condition: service_started
    network_mode: service:openvpn
    volumes:
      - ${OVPN_EASYRSA_PATH:-./easyrsa_master}:/mnt/easyrsa
      - ${OVPN_CCD_PATH:-./ccd_master}:/mnt/ccd
      - ovpn_dynamic_conf:/etc/openvpn-dynamic
      - ovpn_admin_state:/var/lib/ovpn-admin
      # Uncomment to pin admin UI password via htpasswd file:
      # - ./htpasswd:/mnt/auth/htpasswd:ro
      # Then set ADMIN_HTPASSWD_FILE=/mnt/auth/htpasswd in .env

volumes:
  ovpn_dynamic_conf:
  ovpn_admin_state:
