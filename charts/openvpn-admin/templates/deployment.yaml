{{- /* Target uid for the ovpn-admin container. Computed with hasKey (not
       `default`) because runAsUser: 0 is a valid, intentional value that Go
       templates treat as empty — `0 | default 1000` would wrongly yield 1000. */}}
{{- $adminSC := .Values.ovpnAdmin.securityContext | default dict }}
{{- $adminUid := 1000 }}
{{- if hasKey $adminSC "runAsUser" }}{{ $adminUid = $adminSC.runAsUser }}{{ end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openvpn-admin.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openvpn-admin.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Recreate — PKI Secrets are ReadWriteOnce-equivalent; OpenVPN can't run in parallel
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "openvpn-admin.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openvpn-admin.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.rbac.serviceAccountName }}

      {{- if .Values.persistence.enabled }}
      # fsGroup makes the state PVC writable by the non-root ovpnadmin user
      # (member of the "ovpnshared" group baked into the image).
      securityContext:
        fsGroup: {{ .Values.persistence.fsGroup }}
      {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      initContainers:
        - name: init-sysctl
          image: busybox:1.36
          command: ["sysctl", "-w", "net.ipv4.ip_forward=1"]
          securityContext:
            # net.ipv4.ip_forward is a per-netns sysctl and CAP_NET_ADMIN
            # authorizes the write in principle — BUT most CRIs (containerd on
            # YC/GKE-class clusters included) remount /proc/sys read-only for any
            # container that is not privileged, so `sysctl -w` fails with
            # "Read-only file system" no matter the caps. privileged: true is what
            # gives this init a read-write /proc/sys. The blast radius is minimal:
            # an ephemeral busybox that runs one sysctl and exits before the app
            # containers start (same pattern as kube-proxy/CNI init). The pure
            # least-privilege alternative — pod securityContext.sysctls — needs
            # net.ipv4.ip_forward on the kubelet's --allowed-unsafe-sysctls on
            # every node, which is a non-portable per-node infra change.
            privileged: true
            runAsUser: 0
            allowPrivilegeEscalation: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN"]
            seccompProfile:
              type: RuntimeDefault

        - name: init-dirs
          image: busybox:1.36
          # chmod 2775 (not 700): the ccd emptyDir is group-owned by fsGroup
          # (ovpnshared) so the non-root ovpn-admin container (uid 1000, member
          # of that group) can write CCD files; setgid makes new files inherit
          # the group, and o+rx lets openvpn read them if it drops privileges.
          # 700 would leave the dir root-only → ovpn-admin fatals with
          # "open /etc/openvpn/ccd/...: permission denied".
          # Also normalise the session signing key to <adminUid>:0600. A key from
          # a pre-2.0.58 build (or a permissive umask) can sit on the PVC as 0660
          # AND owned by a different uid than the app now runs as (e.g. a legacy
          # non-root 1000 key while the app now runs as root for the firewall).
          # The strict owner-only trust check (2.0.58+) rejects both, so we chown
          # to the app's uid and chmod 0600 — a chown+chmod, never a delete, so
          # admin sessions survive and existing MFA secrets stay decryptable. This
          # needs CHOWN (change owner) and FOWNER (chmod a file we don't own);
          # DAC_OVERRIDE lets root traverse the dir regardless of its mode.
          command:
            - sh
            - -c
            - |
              mkdir -p /etc/openvpn/ccd && chmod 2775 /etc/openvpn/ccd
              key=/var/lib/ovpn-admin/.session_signing_key
              if [ -f "$key" ]; then
                chown {{ $adminUid }} "$key" || true
                chmod 0600 "$key"
              fi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: false
            runAsUser: 0
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: openvpn-ccd
              mountPath: /etc/openvpn/ccd
            - name: ovpn-admin-state
              mountPath: /var/lib/ovpn-admin

      containers:

        # ── OpenVPN ────────────────────────────────────────────────────
        - name: openvpn
          # tag defaults to the chart's appVersion with any leading "v" stripped:
          # CI stamps appVersion as "vX.Y.Z" but ghcr tags are bare "X.Y.Z", so a
          # raw .Chart.AppVersion would resolve to a non-existent :vX.Y.Z tag.
          # Leave image.tag empty in values to track the chart version; set it to
          # pin/override a specific image.
          image: '{{ .Values.openvpn.image.repository }}:{{ .Values.openvpn.image.tag | default (trimPrefix "v" .Chart.AppVersion) }}'
          imagePullPolicy: {{ .Values.openvpn.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              echo "Waiting for ovpn-admin to render server.conf..."
              until [ -f /etc/openvpn-dynamic/server.conf ]; do
                sleep 1
              done
              echo "Waiting for PKI..."
              until [ -f /etc/openvpn/pki/ca.crt ] && \
                    [ -f /etc/openvpn/pki/dh.pem ] && \
                    [ -f /etc/openvpn/pki/issued/server.crt ] && \
                    [ -f /etc/openvpn/pki/private/server.key ] && \
                    [ -f /etc/openvpn/pki/ta.key ]; do
                echo "PKI not ready, retrying in 5s..."
                sleep 5
              done
              {{- if .Values.openvpn.masquerade }}
              # SNAT VPN client traffic to the pod IP. Our custom command bypasses
              # the image's configure.sh (which normally runs ensure_masquerade),
              # so without this the destination networks receive packets sourced
              # from the VPN subnet ({{ .Values.openvpn.networkPrefix }}) — which
              # they don't route back — and every pushed route is unreachable.
              # `! -d <vpnNet>` leaves intra-VPN (client-to-client) traffic un-NATed.
              VPN_CIDR="{{ .Values.openvpn.networkPrefix }}"
              iptables -t nat -C POSTROUTING -s "$VPN_CIDR" ! -d "$VPN_CIDR" -j MASQUERADE 2>/dev/null \
                || iptables -t nat -A POSTROUTING -s "$VPN_CIDR" ! -d "$VPN_CIDR" -j MASQUERADE \
                || echo "WARN: MASQUERADE install failed — pushed routes will be unreachable"
              {{- end }}
              # openvpn won't pick up a "hard" server-config change (port / proto
              # / cipher / tls-mode / DCO) on its own, and signalling it via the
              # single-client management console is unreliable when another
              # consumer (mgmt-client-auth) holds it. So: run openvpn in the
              # FOREGROUND via exec — it becomes PID 1 and receives signals
              # directly (both from the kubelet on pod shutdown and from the
              # watcher below) — and fork a watcher that restarts the container,
              # by TERMing PID 1, whenever ovpn-admin rewrites server.conf. The
              # new config loads on the kubelet restart. Saves are rare admin
              # actions, so the few seconds of VPN downtime are fine.
              #
              # This deliberately avoids the earlier `openvpn & ; OVPN_PID=$! ;
              # while kill -0 "$OVPN_PID"` pattern: in prod that loop silently
              # stopped iterating (fell through to `wait`), so server.conf changes
              # were NEVER applied to a running openvpn. Watching from a separate
              # process and signalling the fixed PID 1 has no such failure mode.
              CONF_SUM=$(md5sum /etc/openvpn-dynamic/server.conf | awk '{print $1}')
              (
                while sleep 5; do
                  NEW_SUM=$(md5sum /etc/openvpn-dynamic/server.conf | awk '{print $1}')
                  if [ "$NEW_SUM" != "$CONF_SUM" ]; then
                    echo "server.conf changed — restarting openvpn to apply new config"
                    kill -TERM 1 2>/dev/null
                    exit 0
                  fi
                done
              ) &
              exec openvpn --config /etc/openvpn-dynamic/server.conf
          ports:
            - name: openvpn
              containerPort: {{ .Values.openvpn.port }}
              protocol: {{ .Values.openvpn.proto | upper }}
              {{- if eq .Values.openvpn.inlet "HostPort" }}
              hostPort: {{ .Values.openvpn.hostPort }}
              {{- end }}
          # OpenVPN needs root for /dev/net/tun and a narrow capability set;
          # override via openvpn.securityContext in values.yaml if your cluster
          # policy differs.
          securityContext:
            {{- toYaml .Values.openvpn.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.openvpn | nindent 12 }}
          volumeMounts:
            - name: ovpn-dynamic-conf
              mountPath: /etc/openvpn-dynamic
            - name: openvpn-pki
              mountPath: /etc/openvpn/pki
            - name: openvpn-ccd
              mountPath: /etc/openvpn/ccd
            {{- if .Values.openvpn.tunDevice.hostPath }}
            # OpenVPN needs /dev/net/tun. The Alpine openvpn image doesn't mknod
            # it, so mount the node's device (the node must have the tun module).
            - name: tun-device
              mountPath: /dev/net/tun
            {{- end }}

        # ── ovpn-admin UI ──────────────────────────────────────────────
        - name: ovpn-admin
          # See the openvpn container above: tag defaults to appVersion with a
          # leading "v" stripped so an empty image.tag tracks the chart version.
          image: '{{ .Values.ovpnAdmin.image.repository }}:{{ .Values.ovpnAdmin.image.tag | default (trimPrefix "v" .Chart.AppVersion) }}'
          imagePullPolicy: {{ .Values.ovpnAdmin.image.pullPolicy }}
          # runAsUser MUST stay numeric while runAsNonRoot is true (a name-only
          # image USER fails kubelet's non-root check → CreateContainerConfigError).
          # Override the whole block via ovpnAdmin.securityContext in values.yaml.
          securityContext:
            {{- toYaml .Values.ovpnAdmin.securityContext | nindent 12 }}
          # Seed the first-boot server-config so the rendered server.conf
          # listens on the intended proto/port/network from the very first
          # boot (before any UI save) — required when a fronting L4 proxy
          # targets a fixed port.
          env:
            - name: OVPN_SERVER_PROTO
              value: {{ .Values.openvpn.proto | quote }}
            - name: OVPN_SERVER_PORT
              value: {{ .Values.openvpn.port | quote }}
            - name: OVPN_SERVER_NETWORK
              value: {{ .Values.openvpn.network | quote }}
            - name: OVPN_SERVER_NETWORK_MASK
              value: {{ .Values.openvpn.networkMask | quote }}
            {{- if and .Values.ovpnAdmin.metricsEnabled .Values.ovpnAdmin.metrics.port }}
            - name: OVPN_METRICS_PORT
              value: {{ .Values.ovpnAdmin.metrics.port | quote }}
            {{- end }}
          command: ["/app/ovpn-admin"]
          args:
            - --listen.host=0.0.0.0
            - --listen.port={{ .Values.ovpnAdmin.port }}
            - --ovpn.network={{ .Values.openvpn.networkPrefix }}
            - --storage.backend={{ .Values.ovpnAdmin.storageBackend }}
            - --mgmt=main=127.0.0.1:8989
            - --server-config.conf-path=/etc/openvpn-dynamic/server.conf
            # Durable auth/usage state (signing key, MFA secrets, logout
            # blacklist, API tokens, traffic history, self-changed admin
            # password) — see "persistence" in values.yaml.
            - --session.state-dir=/var/lib/ovpn-admin
            - --mfa.db-path=/var/lib/ovpn-admin/_mfa_secrets.json
            {{- if .Values.ovpnAdmin.ccdEnabled }}
            - --ccd
            - --ccd.path=/etc/openvpn/ccd
            {{- end }}
            {{- if .Values.openvpn.serverName }}
            - --ovpn.server={{ .Values.openvpn.serverName }}:{{ .Values.openvpn.port }}:{{ .Values.openvpn.proto }}
            {{- end }}
            {{- if .Values.ovpnAdmin.metricsEnabled }}
            - --metrics.path={{ .Values.ovpnAdmin.metricsPath }}
            {{- end }}
            {{- if .Values.ovpnAdmin.adminHtpasswdSecret }}
            - --admin.htpasswd-file=/etc/ovpn-admin/auth/htpasswd
            {{- end }}
            {{- if .Values.ovpnAdmin.firewall.enabled }}
            - --firewall
            - --firewall.chain-name={{ .Values.ovpnAdmin.firewall.chainName }}
            - --firewall.iptables-bin={{ .Values.ovpnAdmin.firewall.iptablesBin }}
            - --firewall.reconcile-interval={{ .Values.ovpnAdmin.firewall.reconcileInterval }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.ovpnAdmin.port }}
              protocol: TCP
            {{- if and .Values.ovpnAdmin.metricsEnabled .Values.ovpnAdmin.metrics.port }}
            - name: metrics
              containerPort: {{ .Values.ovpnAdmin.metrics.port }}
              protocol: TCP
            {{- end }}
          resources:
            {{- toYaml .Values.resources.ovpnAdmin | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.ovpnAdmin.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.ovpnAdmin.livenessProbe | nindent 12 }}
          {{- with .Values.ovpnAdmin.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: ovpn-dynamic-conf
              mountPath: /etc/openvpn-dynamic
            - name: openvpn-pki
              mountPath: /etc/openvpn/pki
            - name: openvpn-ccd
              mountPath: /etc/openvpn/ccd
            - name: ovpn-admin-state
              mountPath: /var/lib/ovpn-admin
            {{- if .Values.ovpnAdmin.dco.enabled }}
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
            {{- end }}
            {{- if .Values.ovpnAdmin.adminHtpasswdSecret }}
            - name: admin-htpasswd
              mountPath: /etc/ovpn-admin/auth
              readOnly: true
            {{- end }}

      volumes:
        # ── server.conf rendered at runtime by ovpn-admin ───────────────
        - name: ovpn-dynamic-conf
          emptyDir: {}

        # ── durable auth/usage state (signing key, MFA, blacklist, API
        #    tokens, traffic history, admin pw) — see persistence in values ──
        - name: ovpn-admin-state
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-state" (include "openvpn-admin.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}

        {{- if .Values.ovpnAdmin.dco.enabled }}
        # ── /lib/modules from host (DCO kernel-module detection) ────────
        # Opt-in: exposes host kernel modules into the pod. Required only when
        # OpenVPN Data Channel Offload (DCO) is desired.
        - name: lib-modules
          hostPath:
            path: /lib/modules
            type: DirectoryOrCreate
        {{- end }}

        # ── PKI from K8s Secrets ────────────────────────────────────────
        # ovpn-admin creates and manages these Secrets via kubernetes.secrets backend
        - name: openvpn-pki
          projected:
            defaultMode: 0400
            sources:
              - secret:
                  name: openvpn-pki-ca
                  optional: true
                  items:
                    - key: tls.crt
                      path: ca.crt
                    - key: tls.key
                      path: private/ca.key
              - secret:
                  name: openvpn-pki-server
                  optional: true
                  items:
                    - key: tls.crt
                      path: issued/server.crt
                    - key: tls.key
                      path: private/server.key
              - secret:
                  name: openvpn-pki-dh-and-ta
                  optional: true
                  items:
                    - key: dh.pem
                      path: dh.pem
                    - key: ta.key
                      path: ta.key
              - secret:
                  name: openvpn-pki-crl
                  optional: true
                  items:
                    - key: crl.pem
                      path: crl.pem
                      # 0644, not the 0400 default: openvpn re-reads the CRL
                      # (crl-verify) on every client connect AFTER it has
                      # dropped privileges to nobody. A 0400 root-owned file is
                      # then unreadable → "CRL: cannot read" → "VERIFY ERROR:
                      # CRL not loaded" → every client rejected as "unknown CA"
                      # whenever the CRL is rewritten (user revoke / restart).
                      # A CRL is public revocation data, so world-readable is safe.
                      mode: 0644

        # ── CCD — managed by ovpn-admin, restored from Secrets on start ─
        - name: openvpn-ccd
          emptyDir: {}

        {{- if .Values.openvpn.tunDevice.hostPath }}
        # ── /dev/net/tun from the node (OpenVPN data plane) ─────────────
        - name: tun-device
          hostPath:
            path: {{ .Values.openvpn.tunDevice.hostPath }}
            type: CharDevice
        {{- end }}

        {{- if .Values.ovpnAdmin.adminHtpasswdSecret }}
        # ── htpasswd from Secret ────────────────────────────────────────
        - name: admin-htpasswd
          secret:
            secretName: {{ .Values.ovpnAdmin.adminHtpasswdSecret }}
            items:
              - key: htpasswd
                path: htpasswd
        {{- end }}
