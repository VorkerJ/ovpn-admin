{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "openvpn-admin.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openvpn-admin.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  {{- if .Values.ingress.hostname }}
  {{- if .Values.ingress.tls.secretName }}
  # Rendered only when ingress.tls.secretName is set. The chart does not create
  # this Secret — point it at an existing TLS Secret, or the name cert-manager
  # will populate (see the cluster-issuer annotation). Empty → no tls block, so
  # `helm install` never references a non-existent Secret.
  tls:
    - hosts:
        - {{ .Values.ingress.hostname }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.hostname }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "openvpn-admin.fullname" . }}
                port:
                  name: http
  {{- end }}
{{- end }}
