{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
# Durable auth state: session signing key, MFA secrets, logout blacklist and
# the self-changed admin password. See values.yaml "persistence".
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "openvpn-admin.fullname" . }}-state
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openvpn-admin.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
