{{- if .Values.rbac.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.rbac.serviceAccountName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openvpn-admin.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "openvpn-admin.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openvpn-admin.labels" . | nindent 4 }}
rules:
  # Read/update/patch is scoped to the known, statically-named secrets that
  # ovpn-admin owns. Per-client cert secrets are created with the dynamic
  # name pattern openvpn-pki-<serial>; resourceNames does not support
  # wildcards, so create/list/delete must remain unscoped within this
  # namespace. We minimize the blast radius by keeping the role
  # namespace-scoped (Role, not ClusterRole).
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - "openvpn-pki-ca"
      - "openvpn-pki-server"
      - "openvpn-pki-dh-and-ta"
      - "openvpn-pki-crl"
      - "openvpn-pki-index-txt"
      - "ovpn-admin-common-routes"
      - "ovpn-admin-server-config"
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    # No resourceNames possible: client cert secrets use the
    # dynamic name pattern openvpn-pki-<serial>.
    verbs: ["create", "list", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "openvpn-admin.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openvpn-admin.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "openvpn-admin.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.rbac.serviceAccountName }}
    namespace: {{ .Release.Namespace }}
{{- end }}
