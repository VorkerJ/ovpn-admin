{{- if .Values.rbac.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.rbac.serviceAccountName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openvpn-admin.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "openvpn-admin.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openvpn-admin.labels" . | nindent 4 }}
rules:
  # Read/update/patch is scoped to the known, statically-named secrets that
  # ovpn-admin owns. Per-client cert secrets are created with the dynamic
  # name pattern openvpn-pki-<serial>; resourceNames does not support
  # wildcards, so create/list/delete must remain unscoped within this
  # namespace. We minimize the blast radius by keeping the role
  # namespace-scoped (Role, not ClusterRole).
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - "openvpn-pki-ca"
      - "openvpn-pki-server"
      - "openvpn-pki-dh-and-ta"
      - "openvpn-pki-crl"
      - "openvpn-pki-index-txt"
      - "ovpn-admin-common-routes"
      - "ovpn-admin-server-config"
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    # ⚠ SECURITY RISK — READ THIS ⚠
    # This grants create/list/update/patch/delete on EVERY Secret in the release
    # namespace (no resourceNames): client cert secrets use the dynamic name
    # pattern openvpn-pki-<serial>, and resourceNames does not support wildcards,
    # so these verbs cannot be narrowed. Consequence: a compromise of ovpn-admin
    # (or its ServiceAccount token) can read/alter/delete ANY Secret that shares
    # this namespace.
    #   MITIGATION: run ovpn-admin in a DEDICATED namespace containing nothing
    #   else (`helm install -n ovpn-admin --create-namespace ...`), so the blast
    #   radius is limited to this app's own Secrets. This is inherent to the
    #   kubernetes.secrets PKI backend and CANNOT be fixed by tightening the Role.
    #   We already keep it as narrow as possible: a namespaced Role (not a
    #   ClusterRole), and the static secrets above are pinned by resourceNames.
    # `update`/`patch` are required here (not just on the static secrets above)
    # because revoke AND delete mutate the client's OWN cert secret — revoke
    # stamps a `revokedAt` annotation, delete relabels it to REVOKED-<cn>-<hash>.
    # Without update, delete/revoke fail with "cannot update resource secrets"
    # and the user is never removed.
    verbs: ["create", "list", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "openvpn-admin.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openvpn-admin.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "openvpn-admin.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.rbac.serviceAccountName }}
    namespace: {{ .Release.Namespace }}
{{- end }}
