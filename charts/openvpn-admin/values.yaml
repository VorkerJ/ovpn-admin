# ================================================================
# openvpn-admin Helm chart — default values
# ================================================================

# Override the generated resource name prefix. Set this when migrating onto this
# chart from another one so Services keep their existing names (e.g. an HAProxy
# tcp-services entry targeting "<release>-<chart>-openvpn" must not change).
nameOverride: ""
fullnameOverride: ""

# ----------------------------------------------------------------
# ovpn-admin UI
# ----------------------------------------------------------------
ovpnAdmin:
  image:
    repository: ghcr.io/vorkerj/ovpn-admin/ovpn-admin
    # tag: defaults to .Chart.AppVersion when empty
    tag: ""
    pullPolicy: IfNotPresent

  port: 8080

  # Container securityContext for the ovpn-admin container. Rendered verbatim.
  # NOTE: keep runAsUser numeric while runAsNonRoot is true — the image's user is
  # baked as uid 1000; a name-only user fails the kubelet non-root check
  # (CreateContainerConfigError) on clusters that enforce runAsNonRoot.
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false   # writes the rendered server.conf
    capabilities:
      drop: ["ALL"]
      add: ["NET_ADMIN"]            # firewall feature; drop if firewall disabled
    seccompProfile:
      type: RuntimeDefault

  # CCD (client-config-dir): per-user static IPs and push routes
  ccdEnabled: true

  # Prometheus metrics endpoint
  metricsEnabled: true
  metricsPath: "/metrics"

  # PKI storage backend: "filesystem" or "kubernetes.secrets"
  # kubernetes.secrets stores all certs in etcd — no PVC needed
  storageBackend: "kubernetes.secrets"

  # Admin UI authentication via htpasswd file (bcrypt).
  # Name of a K8s Secret with key "htpasswd".
  # If empty — a random password is generated at startup and printed to logs.
  # Create: htpasswd -c -B /tmp/htpasswd admin
  #         kubectl create secret generic ovpn-admin-ui-auth --from-file=htpasswd=/tmp/htpasswd
  adminHtpasswdSecret: ""

  # OpenVPN Data Channel Offload (DCO) — kernel-module detection.
  # When enabled, the pod mounts /lib/modules from the host (read-only).
  # Leave disabled unless you actually need DCO; the hostPath is a known
  # node-isolation weak point and is not required for normal operation.
  dco:
    enabled: false

  # Server-side per-client route enforcement via iptables.
  # When enabled, ovpn-admin installs FORWARD rules so that each connected client
  # can only reach destinations explicitly allowed via:
  #  - per-user CCD CustomRoutes
  #  - global Common Routes
  # Requires NET_ADMIN capability on the container and iptables binary in image.
  firewall:
    enabled: true               # default ON for new installs; existing users see CHANGELOG
    chainName: "OVPN_FW"
    iptablesBin: "/usr/sbin/iptables"
    reconcileInterval: "5m"

# ----------------------------------------------------------------
# Persistent auth state
# ----------------------------------------------------------------
# Durable storage for ovpn-admin's runtime state, mounted at /var/lib/ovpn-admin
# and passed via --session.state-dir. This is SEPARATE from PKI storage
# (storageBackend above): the PKI can live in K8s Secrets while this volume holds
#   - the session signing key            (sessions survive restarts)
#   - MFA (TOTP) enrollment + backup codes
#   - the logout/revoked-token blacklist
#   - service-account API tokens
#   - per-user traffic history (traffic.db)
#   - the self-changed admin password    (only when no adminHtpasswdSecret is set)
#
# >>> Strongly recommended ON in production. <<<
# When disabled this state lives on an emptyDir (pod-lifetime only), so EVERY pod
# restart / rollout:
#   - logs out all admins and drops the MFA enrollment (re-enroll from scratch —
#     and 2FA is effectively off until then),
#   - resets all per-user traffic counters and revokes API tokens,
#   - in no-htpasswd mode, re-triggers the forced first-login password change.
#
# Left OFF by default only so a bare `helm install` still starts on clusters with
# no default StorageClass. Set enabled=true (and a storageClass if needed) for any
# real deployment. Upgrades from a build that stored this state elsewhere are
# migrated automatically on first start — no manual copy needed.
persistence:
  enabled: false
  # existingClaim: ""          # use a pre-created PVC instead of creating one
  storageClass: ""             # "" = cluster default StorageClass
  accessMode: ReadWriteOnce
  size: 64Mi                   # plenty: state is KBs + traffic.db grows ~50 B per user-month
  # fsGroup of the "ovpnshared" group baked into the image; ovpnadmin is a
  # member, so the volume becomes writable without knowing the uid.
  fsGroup: 2000

# ----------------------------------------------------------------
# OpenVPN server
# ----------------------------------------------------------------
openvpn:
  image:
    repository: ghcr.io/vorkerj/ovpn-admin/openvpn
    # tag: defaults to .Chart.AppVersion when empty
    tag: ""
    pullPolicy: IfNotPresent

  # Container securityContext for the openvpn container. It needs root for
  # /dev/net/tun plus a narrow capability set; override here if your cluster
  # policy differs.
  securityContext:
    runAsNonRoot: false
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
      add: ["NET_ADMIN", "NET_RAW", "MKNOD"]
    seccompProfile:
      type: RuntimeDefault

  # OpenVPN needs the TUN device. The Alpine openvpn image doesn't create it, so
  # by default we bind-mount the node's /dev/net/tun into the openvpn container
  # (the node must have the tun kernel module). Set hostPath to "" to disable
  # (e.g. if you provide the device another way / use DCO).
  tunDevice:
    hostPath: /dev/net/tun

  # External hostname or IP used in generated .ovpn client configs
  # serverName: vpn.example.com

  proto: tcp
  port: 1194

  # VPN subnet (address/mask)
  network: "172.16.100.0"
  networkMask: "255.255.255.0"
  networkPrefix: "172.16.100.0/24"

  logLevel: 3

  # Expose OpenVPN port: HostPort | ClusterIP | LoadBalancer | ExternalIP
  #  - ClusterIP: in-cluster Service only; put an external L4 proxy in front
  #    (e.g. HAProxy tcp-services) that targets <ns>/<release>-openvpn:<port>.
  #    Pin the Service name with fullnameOverride (below) so the proxy target is
  #    stable across a chart migration.
  inlet: HostPort
  hostPort: 1194
  # externalIP: 1.2.3.4      # for ExternalIP inlet
  # externalPort: 1194        # for ClusterIP / LoadBalancer / ExternalIP inlet

# ----------------------------------------------------------------
# Service for admin UI
# ----------------------------------------------------------------
service:
  type: ClusterIP
  port: 8080

# ----------------------------------------------------------------
# Ingress for admin UI
# ----------------------------------------------------------------
ingress:
  enabled: false
  className: ""
  hostname: ""
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt

# ----------------------------------------------------------------
# RBAC
# ----------------------------------------------------------------
rbac:
  create: true
  serviceAccountName: ovpn-admin

# ----------------------------------------------------------------
# Resources
# ----------------------------------------------------------------
resources:
  openvpn:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  ovpnAdmin:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# One replica — OpenVPN is stateful, PKI can't be shared between pods
replicaCount: 1

nodeSelector: {}
tolerations: []

# ----------------------------------------------------------------
# ServiceMonitor for Prometheus Operator (optional)
# ----------------------------------------------------------------
serviceMonitor:
  enabled: false
  interval: 30s
  namespace: monitoring
