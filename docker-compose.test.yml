version: '3'

services:
  pki-init:
    image: alpine:3.23
    volumes:
      - pki_data:/pki
      - ccd_data:/ccd
    command: >
      sh -c "
        if [ -f /pki/pki/index.txt ]; then
          echo 'PKI already initialized, skipping';
          exit 0;
        fi;
        apk add --no-cache easy-rsa openssl &&
        ln -s /usr/share/easy-rsa/easyrsa /usr/local/bin/easyrsa &&
        mkdir -p /pki && cd /pki &&
        EASYRSA_BATCH=1 easyrsa init-pki &&
        EASYRSA_BATCH=1 EASYRSA_REQ_CN=TestCA easyrsa build-ca nopass &&
        EASYRSA_BATCH=1 easyrsa gen-req alice nopass &&
        EASYRSA_BATCH=1 easyrsa sign-req client alice &&
        EASYRSA_BATCH=1 easyrsa gen-req bob nopass &&
        EASYRSA_BATCH=1 easyrsa sign-req client bob &&
        EASYRSA_BATCH=1 easyrsa gen-req charlie nopass &&
        EASYRSA_BATCH=1 easyrsa sign-req client charlie &&
        mkdir -p /ccd &&
        chgrp -R 2000 /pki /ccd &&
        chmod -R g+rwX /pki /ccd &&
        echo 'PKI initialized'
      "

  ovpn-admin:
    build:
      context: .
      dockerfile: Dockerfile.ovpn-admin
    image: ovpn-admin:local
    command: /app/ovpn-admin
    # A "hard" server-config save (e.g. toggling password auth) self-exits so the
    # runtime rebinds the netns to a restarted openvpn. There's no openvpn here,
    # but keep the restart policy so the panel comes back after that self-exit.
    restart: unless-stopped
    depends_on:
      pki-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8088:8080"
    environment:
      OVPN_NETWORK: "192.168.100.0/24"
      OVPN_CCD: "true"
      OVPN_CCD_PATH: "/mnt/ccd"
      EASYRSA_PATH: "/mnt/easyrsa"
      OVPN_INDEX_PATH: "/mnt/easyrsa/pki/index.txt"
      # Per-user VPN password auth (GUI-toggled): point at the shared users.db
      # and let ovpn-admin create it on first start. In prod the openvpn
      # container's configure.sh stages this; the test stack has no openvpn
      # container, so init it here.
      OVPN_AUTH_DB_PATH: "/mnt/easyrsa/pki/users.db"
      OVPN_AUTH_DB_INIT: "true"
      # No openvpn container here, so point the rendered server.conf at a
      # writable path (the default /etc/openvpn/server.conf isn't writable by the
      # non-root panel user). Lets the server-config UI actually save in tests.
      OVPN_SERVER_CONFIG_PATH: "/tmp/server.conf"
      # Don't force MFA in the test stack so the browser login stays single-step
      # (MFA is still available — set OVPN_MFA_REQUIRED=true to demand it). With
      # it off, the MFA-gated server-config / password endpoints accept a plain
      # admin session, which keeps the local demo simple.
      OVPN_MFA_REQUIRED: "false"
      LOG_LEVEL: "debug"
      # Test stack is served over plain HTTP (and often reached by LAN IP, not
      # localhost). Drop the Secure flag so the session cookie is actually sent
      # — otherwise the browser withholds it and every request is 401. NEVER set
      # this in production; put TLS in front instead.
      OVPN_INSECURE_COOKIES: "true"
    volumes:
      - pki_data:/mnt/easyrsa
      - ccd_data:/mnt/ccd

volumes:
  pki_data:
  ccd_data:
